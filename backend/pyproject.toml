[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-dtn-engine"
version = "0.1.0"
description = "Deterministic discrete-event engine for LEO-DTN experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
